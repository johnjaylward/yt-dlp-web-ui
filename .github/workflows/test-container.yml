name: Build and test container
run-name: Build and test (${{ github.ref_name }})

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [ master, server-v4 ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/setup-buildx-action@v4
    - name: Check yt-dlp allowlist against packaged binary
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        tags: yt-dlp-webui-ci:latest
        platforms: linux/amd64
        load: true
        cache-from: type=gha,scope=yt-dlp-webui
        cache-to: type=gha,mode=max,scope=yt-dlp-webui,ignore-error=true
    - name: Capture packaged yt-dlp options
      run: docker run --rm --entrypoint yt-dlp yt-dlp-webui-ci:latest --help > yt-dlp-help.txt
    - name: Test allowlist against packaged yt-dlp
      env:
        YTDLP_HELP_PATH: ${{ github.workspace }}/yt-dlp-help.txt
      run: go test ./server/internal/downloaders -run '^TestAllowedFlagsSupportedByYtDlp$'
