name: Docker Image CI

on:
  pull_request:
    branches: [ "master", "server-v4" ]
  push:
    branches: [ "master", "server-v4" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Check yt-dlp allowlist against packaged binary
      run: docker build . --file Dockerfile --tag yt-dlp-webui-ci:latest
    - name: Capture packaged yt-dlp options
      run: docker run --rm --entrypoint yt-dlp yt-dlp-webui-ci:latest --help > yt-dlp-help.txt
    - name: Test allowlist against packaged yt-dlp
      env:
        YTDLP_HELP_PATH: yt-dlp-help.txt
      run: go test ./server/internal/downloaders -run '^TestAllowedFlagsSupportedByYtDlp$'