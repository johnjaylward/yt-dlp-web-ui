name: Build, Test, and Publish container images
run-name: Build, Test, and Publish container images (${{ github.ref_name }})
on:
  release:
    types: [published]
  push:
    branches: [ master, server-v4 ]
  schedule:
    - cron : '0 1 * * 0'

jobs:
  build-test:
    uses: ./.github/workflows/test-container.yml
    permissions:
      contents: read

  check-publish-secrets:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_HUB_USERNAME" && -n "$DOCKER_HUB_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub credentials are not configured; skipping the Docker Hub publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: [ build-test, check-publish-secrets ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.check-publish-secrets.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Generate GHCR metadata
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=v4,enable=${{ github.ref == 'refs/heads/server-v4' }}
            type=ref,event=tag

      - name: Generate Docker Hub metadata
        id: meta-dockerhub
        if: needs.check-publish-secrets.outputs.available == 'true'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/yt-dlp-webui
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=v4,enable=${{ github.ref == 'refs/heads/server-v4' }}
            type=ref,event=tag

      - name: Build and publish image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}

      - name: Sign the GHCR image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}

      - name: Sign the Docker Hub image
        if: needs.check-publish-secrets.outputs.available == 'true'
        run: cosign sign --yes docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/yt-dlp-webui@${{ steps.build-and-push.outputs.digest }}
