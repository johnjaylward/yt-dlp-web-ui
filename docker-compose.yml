services:
  yt-dlp-webui:
    image: marcobaobao/yt-dlp-webui
    environment:
      # Required only when local authentication or OpenID authentication is enabled.
      JWT_SECRET: ${JWT_SECRET:-}
      # Optional comma-separated origins for cross-origin browser access. Empty means same-origin only.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - 3033:3033
    volumes:
      - <your dir>:/downloads # replace <your dir> with a directory on your host system
      - <your dir>:/config    # directory where config.yml will be stored
    healthcheck:
      test: curl -f http://localhost:3033 || exit 1
    restart: unless-stopped
