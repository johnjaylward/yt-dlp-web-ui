services:
  app:
    image: marcobaobao/yt-dlp-webui
    environment:
      # Required only when local authentication or OpenID authentication is enabled.
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./downloads:/downloads
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./app.conf:/etc/nginx/conf.d/app.conf
    depends_on: 
      - app
    ports: 
      - 80:80
